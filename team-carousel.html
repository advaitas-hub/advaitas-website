<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Carousel - ADVAITA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(180deg, #0a0f1e 0%, #0a1628 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .carousel-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .carousel-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .carousel-title {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #22d3ee, #0891b2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        .carousel-subtitle {
            font-size: 18px;
            color: rgba(34, 211, 238, 0.6);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .circular-carousel {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .carousel-track {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 280px;
            margin: 0 auto;
        }

        .carousel-card {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 192px;
            height: 128px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            border-radius: 16px;
            border: 1px solid rgba(34, 211, 238, 0.2);
            background: linear-gradient(180deg, rgba(8, 145, 178, 0.3), rgba(6, 78, 59, 0.4));
            backdrop-filter: blur(10px);
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.65s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 8px 24px -4px rgba(8, 145, 178, 0.2);
        }

        .carousel-card.active {
            box-shadow: 0 20px 60px -12px rgba(8, 145, 178, 0.5);
        }

        .carousel-card:hover {
            box-shadow: 0 12px 32px -4px rgba(8, 145, 178, 0.3);
        }

        .card-tag {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(34, 211, 238, 0.2);
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(34, 211, 238, 0.9);
        }

        .card-content {
            width: 100%;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 4px;
            line-height: 1.3;
            transition: all 0.3s;
        }

        .carousel-card.active .card-title {
            font-size: 16px;
            color: #ffffff;
        }

        .card-description {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: all 0.3s;
        }

        .carousel-card.active .card-description {
            color: rgba(255, 255, 255, 0.6);
        }

        .carousel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .carousel-number {
            font-size: 48px;
            font-weight: 700;
            color: rgba(34, 211, 238, 0.9);
            line-height: 1;
        }

        .carousel-total {
            font-size: 12px;
            color: rgba(34, 211, 238, 0.4);
            margin-top: 4px;
        }

        .carousel-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 20;
        }

        .carousel-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(34, 211, 238, 0.2);
            background: rgba(34, 211, 238, 0.1);
            backdrop-filter: blur(10px);
            color: rgba(34, 211, 238, 0.7);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .carousel-btn:hover {
            background: rgba(34, 211, 238, 0.2);
            color: rgba(34, 211, 238, 1);
            transform: scale(1.08);
        }

        .carousel-btn:active {
            transform: scale(0.95);
        }

        .carousel-dots {
            display: flex;
            gap: 6px;
        }

        .carousel-dot {
            width: 6px;
            height: 6px;
            border-radius: 3px;
            background: rgba(34, 211, 238, 0.2);
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .carousel-dot.active {
            width: 24px;
            background: rgba(34, 211, 238, 0.8);
        }

        .carousel-dot:hover {
            background: rgba(34, 211, 238, 0.4);
        }

        /* Chevron Icons */
        .chevron {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        @media (max-width: 768px) {
            .carousel-title {
                font-size: 32px;
            }

            .carousel-subtitle {
                font-size: 16px;
            }

            .carousel-track {
                height: 240px;
            }

            .carousel-card {
                width: 160px;
                height: 110px;
                padding: 12px;
            }

            .carousel-number {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="carousel-container">
        <div class="carousel-header">
            <h2 class="carousel-title">Meet Our Team</h2>
            <p class="carousel-subtitle">
                Passionate innovators driving ADVAITA's mission to transform businesses through technology
            </p>
        </div>

        <div class="circular-carousel">
            <div class="carousel-track" id="carouselTrack">
                <!-- Cards will be dynamically inserted here -->
            </div>

            <div class="carousel-center">
                <div class="carousel-number" id="carouselNumber">01</div>
                <div class="carousel-total" id="carouselTotal">of 06</div>
            </div>

            <div class="carousel-controls">
                <button class="carousel-btn" id="prevBtn" aria-label="Previous">
                    <svg class="chevron" viewBox="0 0 24 24">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>

                <div class="carousel-dots" id="carouselDots"></div>

                <button class="carousel-btn" id="nextBtn" aria-label="Next">
                    <svg class="chevron" viewBox="0 0 24 24">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Team data
        const teamMembers = [
            {
                id: 1,
                name: "Rajesh Kumar",
                role: "CEO & Founder - Visionary leader with 15+ years in enterprise software solutions.",
                tag: "CEO"
            },
            {
                id: 2,
                name: "Priya Sharma",
                role: "CTO & Co-Founder - Tech innovator specializing in scalable architecture and AI.",
                tag: "CTO"
            },
            {
                id: 3,
                name: "Amit Patel",
                role: "VP Engineering - Building high-performance teams and cutting-edge products.",
                tag: "VP Eng"
            },
            {
                id: 4,
                name: "Neha Singh",
                role: "Head of Design - Creating beautiful, user-centric experiences that delight.",
                tag: "Design"
            },
            {
                id: 5,
                name: "Vikram Reddy",
                role: "Head of Product - Driving product strategy and innovation across platforms.",
                tag: "Product"
            },
            {
                id: 6,
                name: "Ananya Gupta",
                role: "Head of Operations - Ensuring excellence in delivery and client success.",
                tag: "Operations"
            }
        ];

        // Configuration
        const VISIBLE_COUNT = 5;
        const RADIUS_X = 220;
        const RADIUS_Y = 100;
        const AUTO_PLAY_INTERVAL = 5000;

        let currentIndex = 0;
        let autoPlayInterval = null;
        let isHovered = false;

        // Get elements
        const track = document.getElementById('carouselTrack');
        const numberEl = document.getElementById('carouselNumber');
        const totalEl = document.getElementById('carouselTotal');
        const dotsContainer = document.getElementById('carouselDots');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // Calculate position for each card
        function getItemPosition(index, activeIndex, total) {
            const offset = index - activeIndex;
            const half = Math.floor(VISIBLE_COUNT / 2);

            let adjustedOffset = offset;
            if (offset > half) adjustedOffset = offset - total;
            if (offset < -half) adjustedOffset = offset + total;
            if (Math.abs(adjustedOffset) > half * 2) return null;

            const angle = (adjustedOffset / VISIBLE_COUNT) * Math.PI;
            const x = Math.sin(angle) * RADIUS_X;
            const y = -Math.cos(angle) * RADIUS_Y;

            const distance = Math.abs(adjustedOffset);
            const maxDistance = half + 1;
            const scale = Math.max(0, 1 - (distance / maxDistance) * 0.3);
            const opacity = Math.max(0.3, 1 - (distance / maxDistance) * 0.7);
            const zIndex = VISIBLE_COUNT - distance;

            return { x, y, scale, opacity, zIndex };
        }

        // Create card element
        function createCard(member, index) {
            const card = document.createElement('div');
            card.className = 'carousel-card';
            card.dataset.index = index;
            card.innerHTML = `
                ${member.tag ? `<span class="card-tag">${member.tag}</span>` : ''}
                <div class="card-content">
                    <h3 class="card-title">${member.name}</h3>
                    <p class="card-description">${member.role}</p>
                </div>
            `;
            card.addEventListener('click', () => goToIndex(index));
            return card;
        }

        // Create dot element
        function createDot(index) {
            const dot = document.createElement('button');
            dot.className = 'carousel-dot';
            dot.setAttribute('aria-label', `Go to slide ${index + 1}`);
            dot.addEventListener('click', () => goToIndex(index));
            return dot;
        }

        // Initialize carousel
        function init() {
            // Create cards
            teamMembers.forEach((member, index) => {
                const card = createCard(member, index);
                track.appendChild(card);
            });

            // Create dots
            teamMembers.forEach((_, index) => {
                const dot = createDot(index);
                dotsContainer.appendChild(dot);
            });

            // Set total
            totalEl.textContent = `of ${String(teamMembers.length).padStart(2, '0')}`;

            // Update positions
            updateCarousel();

            // Event listeners
            prevBtn.addEventListener('click', prev);
            nextBtn.addEventListener('click', next);
            
            track.addEventListener('mouseenter', () => {
                isHovered = true;
                stopAutoPlay();
            });
            
            track.addEventListener('mouseleave', () => {
                isHovered = false;
                startAutoPlay();
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') prev();
                if (e.key === 'ArrowRight') next();
            });

            // Start autoplay
            startAutoPlay();
        }

        // Update carousel positions and states
        function updateCarousel() {
            const cards = track.querySelectorAll('.carousel-card');
            const dots = dotsContainer.querySelectorAll('.carousel-dot');

            cards.forEach((card, index) => {
                const pos = getItemPosition(index, currentIndex, teamMembers.length);
                
                if (pos) {
                    card.style.display = 'flex';
                    card.style.transform = `translate(-50%, -50%) translate(${pos.x}px, ${pos.y}px) scale(${pos.scale})`;
                    card.style.opacity = pos.opacity;
                    card.style.zIndex = pos.zIndex;
                    
                    if (index === currentIndex) {
                        card.classList.add('active');
                    } else {
                        card.classList.remove('active');
                    }
                } else {
                    card.style.display = 'none';
                }
            });

            // Update dots
            dots.forEach((dot, index) => {
                if (index === currentIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });

            // Update number
            numberEl.textContent = String(currentIndex + 1).padStart(2, '0');
        }

        // Navigate to specific index
        function goToIndex(index) {
            currentIndex = ((index % teamMembers.length) + teamMembers.length) % teamMembers.length;
            updateCarousel();
        }

        // Navigate to previous
        function prev() {
            goToIndex(currentIndex - 1);
        }

        // Navigate to next
        function next() {
            goToIndex(currentIndex + 1);
        }

        // Auto-play functions
        function startAutoPlay() {
            stopAutoPlay();
            autoPlayInterval = setInterval(() => {
                if (!isHovered) {
                    next();
                }
            }, AUTO_PLAY_INTERVAL);
        }

        function stopAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
